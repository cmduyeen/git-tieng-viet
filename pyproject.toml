[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "git-tieng-viet"
version = "0.3.0"
description = "Git tiếng Việt cho người mới học và trẻ em — vừa làm vừa học lệnh Git gốc"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Dyn" }
]
dependencies = []
keywords = ["git", "vietnamese", "git-tieng-viet", "vgit", "cli", "education", "beginner"]

[project.urls]
Homepage = "https://github.com/cmduyeen/git-tieng-viet"
Repository = "https://github.com/cmduyeen/git-tieng-viet"
Issues = "https://github.com/cmduyeen/git-tieng-viet/issues"
Funding = "https://ko-fi.com/cmduyeen"

[project.scripts]
vgit = "vgit.cli:main"

[tool.setuptools.packages.find]
include = ["vgit*"]
